<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9828f">
<title>Flavinha Esmalteria</title>
<style>
:root{--rose:#b9828f;--rose2:#ead1d6;--cream:#fffaf8;--brown:#4d3538;--line:#eadfe0}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#b9828f,#d9aeb6);color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:5}
h1{font-family:Georgia,serif;margin:0;font-size:25px}.sub{opacity:.9;font-size:13px;margin-top:4px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:81px;z-index:4;overflow:auto}
nav button{border:0;background:none;padding:13px 15px;color:#76565b;font-weight:700;white-space:nowrap}nav button.active{color:var(--rose);border-bottom:3px solid var(--rose)}
main{padding:16px;max-width:800px;margin:auto}.page{display:none}.page.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #4d35380b}
.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{background:var(--rose);color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:700}.btn.secondary{background:var(--rose2);color:var(--brown)}
input,select,textarea{width:100%;padding:11px;border:1px solid #d9cacc;border-radius:9px;background:#fff;color:var(--brown);font-size:15px}label{font-size:12px;font-weight:700;display:block;margin:10px 0 5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.small{font-size:12px;color:#806a6d}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.dow{text-align:center;font-size:11px;font-weight:bold;padding:5px;color:#87686d}.day{min-height:72px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px;font-size:12px;cursor:pointer}.day.other{opacity:.35}.day.today{outline:2px solid var(--rose)}.appt{background:var(--rose2);border-radius:5px;padding:3px;margin-top:3px;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.week{display:grid;grid-template-columns:58px repeat(7,1fr);overflow:auto}.wkhead{font-size:11px;text-align:center;padding:7px;border-bottom:1px solid var(--line)}.hour{font-size:10px;padding:8px 3px;border-right:1px solid var(--line);height:52px}.slot{height:52px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);position:relative}.slot .appt{position:absolute;inset:3px;font-size:10px}
.listitem{padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.close{float:right;border:0;background:none;font-size:24px}
.empty{text-align:center;padding:25px;color:#8b7477}
.actions{display:flex;gap:7px;margin-top:10px}.danger{color:#a33;border:0;background:none;font-weight:bold}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.modal{align-items:center}.sheet{max-width:520px;border-radius:20px}}
</style>
</head>
<body>
<header><h1>Flavinha Esmalteria</h1><div class="sub">Sua agenda de atendimentos</div></header>
<nav>
<button class="active" onclick="showPage('agenda',this)">📅 Agenda</button>
<button onclick="showPage('clientes',this)">👩 Clientes</button>
<button onclick="showPage('servicos',this)">💅 Serviços</button>
</nav>
<main>
<section id="agenda" class="page active">
<div class="card">
<div class="row"><button class="btn secondary" onclick="changeMonth(-1)">‹</button><strong id="monthTitle"></strong><button class="btn secondary" onclick="changeMonth(1)">›</button></div>
<div class="row" style="margin-top:12px"><button class="btn secondary" onclick="setToday()">Hoje</button><div><button class="btn secondary" onclick="setView('month')">Mês</button> <button class="btn secondary" onclick="setView('week')">Semana</button> <button class="btn secondary" onclick="setView('day')">Dia</button></div></div>
</div>
<div id="calendarBox"></div>
</section>
<section id="clientes" class="page">
<div class="row"><h2>Clientes</h2><button class="btn" onclick="openClient()">+ Cliente</button></div>
<div class="card"><input id="clientSearch" placeholder="🔎 Procurar cliente..." oninput="renderClients()"></div>
<div id="clientList"></div>
</section>
<section id="servicos" class="page">
<div class="row"><h2>Serviços</h2><button class="btn" onclick="openService()">+ Serviço</button></div>
<div id="serviceList"></div>
</section>
</main>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>

<script>
const KEY='flavinha_esmalteria_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"clients":[],"services":[],"appointments":[]}');
let cursor=new Date(), view='month';
const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='agenda')renderAgenda();if(id==='clientes')renderClients();if(id==='servicos')renderServices()}
function setView(v){view=v;renderAgenda()}
function setToday(){cursor=new Date();renderAgenda()}
function changeMonth(n){if(view==='day')cursor.setDate(cursor.getDate()+n);else if(view==='week')cursor.setDate(cursor.getDate()+n*7);else cursor.setMonth(cursor.getMonth()+n);renderAgenda()}
function appts(date){return data.appointments.filter(a=>a.date===iso(date)).sort((a,b)=>a.time.localeCompare(b.time))}
function nameClient(id){return data.clients.find(c=>c.id===id)?.name||'Cliente removida'}
function nameService(id){return data.services.find(s=>s.id===id)?.name||'Serviço removido'}
function renderAgenda(){document.getElementById('monthTitle').textContent= view==='month'?months[cursor.getMonth()]+' '+cursor.getFullYear():view==='week'?'Semana de '+iso(cursor):cursor.toLocaleDateString('pt-BR');let box=document.getElementById('calendarBox');if(view==='month')renderMonth(box);else if(view==='week')renderWeek(box);else renderDay(box)}
function renderMonth(box){let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7;let html='<div class="calendar">';['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(x=>html+='<div class="dow">'+x+'</div>');for(let i=0;i<42;i++){let d=new Date(y,m,1-start+i), cls=d.getMonth()!==m?'day other':'day';if(iso(d)===iso(new Date()))cls+=' today';html+=`<div class="${cls}" onclick="openAppt('${iso(d)}')"><b>${d.getDate()}</b>`;appts(d).forEach(a=>html+=`<div class="appt">${esc(a.time)} · ${esc(nameClient(a.clientId))}</div>`);html+='</div>'}html+='</div>';box.innerHTML=html}
function monday(d){let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}
function renderWeek(box){let start=monday(cursor),html='<div class="week"><div></div>';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(d.getDate()+i);html+=`<div class="wkhead">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}<br>${d.getDate()}/${d.getMonth()+1}</div>`}for(let h=7;h<=21;h++){html+=`<div class="hour">${pad(h)}:00</div>`;for(let i=0;i<7;i++){let d=new Date(start);d.setDate(d.getDate()+i);let aa=appts(d).filter(a=>+a.time.split(':')[0]===h);html+=`<div class="slot" onclick="openAppt('${iso(d)}','${pad(h)}:00')">`;aa.forEach(a=>html+=`<div class="appt">${esc(a.time)} ${esc(nameClient(a.clientId))}</div>`);html+='</div>'}}box.innerHTML=html+'</div>'}
function renderDay(box){let d=cursor,aa=appts(d),html=`<div class="card"><h3>${d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</h3><button class="btn" onclick="openAppt('${iso(d)}')">+ Novo agendamento</button></div>`;html+=aa.length?'<div class="card">'+aa.map(a=>`<div class="listitem"><b>${esc(a.time)}</b> — ${esc(nameClient(a.clientId))}<br><span class="small">${esc(nameService(a.serviceId))} · R$ ${esc(a.value)}</span><div class="actions"><button class="danger" onclick="editAppt('${a.id}')">Editar</button><button class="danger" onclick="delAppt('${a.id}')">Excluir</button></div></div>`).join('')+'</div>':'<div class="empty">Nenhum agendamento neste dia.</div>';box.innerHTML=html}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openAppt(date,time=''){if(!data.clients.length||!data.services.length){alert('Cadastre pelo menos uma cliente e um serviço antes de agendar.');return}let optsC=data.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''),optsS=data.services.map(s=>`<option value="${s.id}">${esc(s.name)} — R$ ${esc(s.value)}</option>`).join('');openModal(`<h2>Novo agendamento</h2><label>Cliente</label><select id="aClient">${optsC}</select><label>Serviço</label><select id="aService" onchange="fillValue()">${optsS}</select><label>Data</label><input id="aDate" type="date" value="${date}"><label>Horário</label><input id="aTime" type="time" value="${time}"><label>Valor</label><input id="aValue" type="text"><label>Observação</label><textarea id="aObs" rows="3"></textarea><br><button class="btn" onclick="saveAppt()">Salvar agendamento</button>`);fillValue()}
function fillValue(){let s=data.services.find(x=>x.id===document.getElementById('aService').value);if(s)document.getElementById('aValue').value=s.value}
function saveAppt(){let a={id:Date.now().toString(),clientId:aClient.value,serviceId:aService.value,date:aDate.value,time:aTime.value,value:aValue.value,obs:aObs.value};if(!a.date||!a.time){alert('Informe data e horário.');return}data.appointments.push(a);save();closeModal();cursor=parse(a.date);view='day';renderAgenda()}
function editAppt(id){let a=data.appointments.find(x=>x.id===id);if(!a)return;openAppt(a.date,a.time);setTimeout(()=>{aClient.value=a.clientId;aService.value=a.serviceId;aValue.value=a.value;aObs.value=a.obs;document.querySelector('#modalContent .btn').onclick=()=>{a.clientId=aClient.value;a.serviceId=aService.value;a.date=aDate.value;a.time=aTime.value;a.value=aValue.value;a.obs=aObs.value;save();closeModal();cursor=parse(a.date);renderAgenda()}},0)}
function delAppt(id){if(confirm('Excluir este agendamento?')){data.appointments=data.appointments.filter(a=>a.id!==id);save();renderAgenda()}}
function openClient(id=null){let c=id?data.clients.find(x=>x.id===id):{name:'',phone:'',obs:''};openModal(`<h2>${id?'Editar':'Nova'} cliente</h2><label>Nome</label><input id="cName" value="${esc(c.name)}"><label>WhatsApp / telefone</label><input id="cPhone" value="${esc(c.phone)}"><label>Observações</label><textarea id="cObs" rows="3">${esc(c.obs)}</textarea><br><button class="btn" onclick="saveClient('${id||''}')">Salvar</button>`)}
function saveClient(id){let c=id?data.clients.find(x=>x.id===id):{id:Date.now().toString()};c.name=cName.value.trim();c.phone=cPhone.value.trim();c.obs=cObs.value;if(!c.name){alert('Informe o nome.');return}if(!id)data.clients.push(c);save();closeModal();renderClients()}
function renderClients(){let q=(document.getElementById('clientSearch')?.value||'').toLowerCase(),arr=data.clients.filter(c=>c.name.toLowerCase().includes(q));document.getElementById('clientList').innerHTML=arr.length?arr.map(c=>`<div class="card"><div class="row"><div><b>${esc(c.name)}</b><br><span class="small">${esc(c.phone||'Sem telefone')}</span></div><button class="btn secondary" onclick="openClient('${c.id}')">Editar</button></div>${c.obs?'<p class="small">'+esc(c.obs)+'</p>':''}</div>`).join(''):'<div class="empty">Nenhuma cliente cadastrada.</div>'}
function openService(id=null){let s=id?data.services.find(x=>x.id===id):{name:'',duration:'',value:''};openModal(`<h2>${id?'Editar':'Novo'} serviço</h2><label>Nome do serviço</label><input id="sName" value="${esc(s.name)}"><label>Duração</label><input id="sDuration" placeholder="Ex.: 1h30" value="${esc(s.duration)}"><label>Valor (R$)</label><input id="sValue" inputmode="decimal" value="${esc(s.value)}"><br><button class="btn" onclick="saveService('${id||''}')">Salvar</button>`)}
function saveService(id){let s=id?data.services.find(x=>x.id===id):{id:Date.now().toString()};s.name=sName.value.trim();s.duration=sDuration.value.trim();s.value=sValue.value.trim();if(!s.name){alert('Informe o serviço.');return}if(!id)data.services.push(s);save();closeModal();renderServices()}
function renderServices(){document.getElementById('serviceList').innerHTML=data.services.length?data.services.map(s=>`<div class="card"><div class="row"><div><b>${esc(s.name)}</b><br><span class="small">${esc(s.duration||'Duração não informada')} · R$ ${esc(s.value||'0,00')}</span></div><button class="btn secondary" onclick="openService('${s.id}')">Editar</button></div></div>`).join(''):'<div class="empty">Cadastre seus serviços.</div>'}
renderAgenda();renderClients();renderServices();
</script>
</body></html>
